name: Build MLBB ESP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build dylib with embedded plist
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -shared -O2 \
            -fPIC -std=c++17 -D_DARWIN_C_SOURCE \
            -isysroot $SDKROOT \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework Foundation \
            -sectcreate __TEXT __info_plist libmlbb_esp.plist \
            src/esp.cpp \
            src/helpers.cpp \
            src/main.mm \
            -o libmlbb_esp.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: mlbb-esp
          path: libmlbb_esp.dylib
